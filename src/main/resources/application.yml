spring:
  application:
    name: cv-cover-letter-service

server:
  port: ${SERVER_PORT:8091}

cv-cover-letter:
  security:
    gateway-token: ${CV_COVER_LETTER_GATEWAY_TOKEN:}
    document-store-producer-token: ${DOCUMENT_STORE_PRODUCER_TOKEN:}
    application-tracker-producer-token: ${APPLICATION_TRACKER_PRODUCER_TOKEN:}
    payment-service-token: ${CV_COVER_LETTER_TO_PAYMENT_SERVICE_TOKEN:}

llm:
  task-type: ${LLM_TASK_TYPE:CV_COVER_LETTER_GENERATION}
  language: ${LLM_LANGUAGE:UK English}
  temperature: ${LLM_TEMPERATURE:0.0}
  max-tokens: ${LLM_MAX_TOKENS:16384}

prompt:
  selected-release-id: ${PROMPT_BUNDLE_RELEASE:cv-cover-letter-1.6.1}

rejected-generation-quarantine:
  enabled: ${REJECTED_GENERATION_QUARANTINE_ENABLED:false}
  storage-directory: ${REJECTED_GENERATION_QUARANTINE_DIRECTORY:/var/lib/cv-cover-letter/rejected-generations}
  encryption-key-base64: ${REJECTED_GENERATION_QUARANTINE_KEY_BASE64:}
  operator-token: ${REJECTED_GENERATION_OPERATOR_TOKEN:}
  retention: ${REJECTED_GENERATION_QUARANTINE_RETENTION:PT24H}
  cleanup-interval: ${REJECTED_GENERATION_QUARANTINE_CLEANUP_INTERVAL:PT15M}
  max-artifact-bytes: ${REJECTED_GENERATION_QUARANTINE_MAX_ARTIFACT_BYTES:262144}
  max-artifacts: ${REJECTED_GENERATION_QUARANTINE_MAX_ARTIFACTS:1000}
  max-replay-events: ${REJECTED_GENERATION_QUARANTINE_MAX_REPLAY_EVENTS:100}
  allow-operation-bound-context-drift: ${REJECTED_GENERATION_ALLOW_OPERATION_BOUND_CONTEXT_DRIFT:false}

services:
  llm-gateway:
    base-url: ${LLM_GATEWAY_BASE_URL:http://localhost:8090}
  document-store-service:
    base-url: ${DOCUMENT_STORE_SERVICE_BASE_URL:http://localhost:8089}
  application-tracker-service:
    base-url: ${APPLICATION_TRACKER_SERVICE_BASE_URL:http://localhost:8088}
  payment-service:
    base-url: ${PAYMENT_SERVICE_BASE_URL:http://localhost:8099}

management:
  endpoints:
    web:
      exposure:
        include: health

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{correlationId}] [%X{serviceName}] [%thread] %logger{36} - %msg%n"
  level:
    com.jobseekercopilot: ${APP_LOG_LEVEL:INFO}
